<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Stackly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-[#0b1120] text-white h-screen flex flex-col items-center justify-center font-sans px-6 text-center">
    <i class="fa fa-exclamation-triangle text-6xl text-blue-500 mb-6"></i>
    <h1 class="text-4xl font-bold mb-4">404 - Page Not Found</h1>
    <p class="text-gray-400 mb-8">The page you are looking for doesn't exist or is still under construction.</p>
    <div class="flex gap-4">
        <button onclick="window.history.back()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-semibold transition"><i class="fa fa-arrow-left mr-2"></i> Go Back</button>
        <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-6 py-3 rounded-lg font-semibold transition border border-gray-700"><i class="fa fa-home mr-2"></i> Go to Home</a>
    </div>
</body>
</html>
